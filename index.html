<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon projet</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b2a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f1ee; --card: #ffffff; --ink: #2a1b2e; --muted: #6f6173;
    --accent: #5b2a6e; --line: #d9ccd8; --code: #efe6ee;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1220; --card: #271a2d; --ink: #f2e9f4; --muted: #b3a2b8;
      --accent: #c78be0; --line: #4a3752; --code: #33233b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 1rem 0 .25rem; }
  .lead { color: var(--muted); margin: 0 0 1.5rem; }
  h2 { font-size: 1.2rem; margin: 2rem 0 .75rem; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; }
  #readme img { max-width: 100%; height: auto; }
  #readme a { color: var(--accent); }
  #readme pre, #viewer { background: var(--code); padding: .8rem; border-radius: 6px; overflow-x: auto;
    font: .85rem/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
  #readme table { display: block; overflow-x: auto; border-collapse: collapse; }
  #readme td, #readme th { border: 1px solid var(--line); padding: .3rem .6rem; }
  ul.files { list-style: none; margin: 0; padding: 0; }
  ul.files li { margin: 0; }
  ul.files button {
    width: 100%; text-align: left; padding: .6rem .2rem; font: inherit; color: var(--ink);
    background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  ul.files button:hover { color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #viewer { margin-top: 1rem; max-height: 24rem; overflow: auto; }
  #viewer[hidden] { display: none; }
  .msg { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="titre">Mon projet</h1>
  <p class="lead" id="desc"></p>

  <h2>Présentation</h2>
  <section><div id="readme" class="msg">Chargement…</div></section>

  <h2>Fichiers</h2>
  <section>
    <ul class="files" id="files"><li class="msg">Chargement…</li></ul>
    <pre id="viewer" hidden></pre>
  </section>
</main>

<script>
  // À modifier : propriétaire et nom de ton dépôt PUBLIC.
  const OWNER = "Patrikar961";
  const REPO = "corner69";

  const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
  const $ = (id) => document.getElementById(id);

  async function api(path, accept) {
    const r = await fetch(API + path, { headers: { Accept: accept || "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status);
    return r;
  }

  async function init() {
    if (OWNER.startsWith("TON_")) {
      $("readme").textContent = "Renseigne OWNER et REPO dans le fichier.";
      $("files").innerHTML = "";
      return;
    }
    try {
      const info = await (await api("")).json();
      $("titre").textContent = info.name;
      $("desc").textContent = info.description || "";
      document.title = info.name;
    } catch (e) {
      $("readme").textContent = "Dépôt introuvable ou privé (cette page ne gère que les dépôts publics).";
      $("files").innerHTML = "";
      return;
    }

    try {
      // GitHub renvoie le README déjà converti en HTML (assaini côté GitHub).
      $("readme").innerHTML = await (await api("/readme", "application/vnd.github.html+json")).text();
      $("readme").classList.remove("msg");
    } catch (e) {
      $("readme").textContent = "Aucun README.";
    }

    try {
      const items = await (await api("/contents/")).json();
      items.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === "dir" ? -1 : 1));
      const ul = $("files");
      ul.innerHTML = "";
      for (const it of items) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = (it.type === "dir" ? "Dossier : " : "") + it.name;
        if (it.type === "file") b.onclick = () => show(it);
        else b.disabled = true;
        li.appendChild(b);
        ul.appendChild(li);
      }
    } catch (e) {
      $("files").innerHTML = '<li class="msg">Impossible de lister les fichiers.</li>';
    }
  }

  async function show(it) {
    const v = $("viewer");
    v.hidden = false;
    v.textContent = "Chargement…";
    try {
      const r = await fetch(it.download_url);
      v.textContent = await r.text();
    } catch (e) {
      v.textContent = "Impossible d'afficher ce fichier.";
    }
  }

  init();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
